<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, wishlist, ghost, danger · sm/base/lg" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ORBIT — Buttons</title>
<style>
  :root{ --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
         --hairline-strong:rgba(255,255,255,.16); --you:#3987e5; --wish:#c98500; --danger:#d03b3b;
         --font:system-ui,-apple-system,"Segoe UI",sans-serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page); color:var(--ink); font-family:var(--font); padding:32px; }
  h2{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  .set{ margin-bottom:26px; }
  .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .btn{ border:1px solid transparent; border-radius:10px; padding:9px 16px; font-size:14px;
        font-weight:650; cursor:pointer; color:var(--ink); background:var(--surface); font-family:inherit; }
  .btn-primary{ background:var(--you); }
  .btn-wish{ background:transparent; border-color:var(--wish); color:#ffce7a; }
  .btn-ghost{ background:transparent; border-color:var(--hairline-strong); color:var(--ink-2); }
  .btn-danger{ background:transparent; color:var(--danger); }
  .btn-sm{ padding:6px 12px; font-size:13px; border-radius:8px; }
  .btn-lg{ padding:12px 22px; font-size:15.5px; border-radius:12px; }
</style>
</head>
<body>
  <div class="set">
    <h2>Variants</h2>
    <div class="row">
      <button class="btn btn-primary">✓&nbsp; Been there</button>
      <button class="btn btn-wish">☆&nbsp; Dream trip</button>
      <button class="btn btn-ghost">Plan a trip here →</button>
      <button class="btn btn-danger">Remove</button>
    </div>
  </div>
  <div class="set">
    <h2>Sizes</h2>
    <div class="row">
      <button class="btn btn-primary btn-sm">Small</button>
      <button class="btn btn-primary">Base</button>
      <button class="btn btn-primary btn-lg">Large</button>
    </div>
  </div>
</body>
</html>
