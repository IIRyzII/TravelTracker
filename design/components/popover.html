<!-- @dsCard group="Components" name="Place popover" subtitle="Country / town selector with actions" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ORBIT — Place popover</title>
<style>
  :root{ --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232322; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
         --hairline:rgba(255,255,255,.10); --hairline-strong:rgba(255,255,255,.16);
         --you:#3987e5; --wish:#c98500; --radius:14px; --font:system-ui,-apple-system,"Segoe UI",sans-serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:radial-gradient(ellipse 70% 60% at 50% 45%,#141c2c,#0e1118 55%,#0d0d0d);
        color:var(--ink); font-family:var(--font); padding:40px; display:grid; place-items:center; min-height:100vh; }
  .pop{ width:280px; background:var(--surface-2); border:1px solid var(--hairline-strong);
        border-radius:var(--radius); padding:14px; box-shadow:0 16px 40px rgba(0,0,0,.55); }
  .head{ display:flex; align-items:flex-start; gap:10px; }
  .flag{ font-size:26px; line-height:1.2; }
  .name{ font-weight:700; font-size:16px; }
  .meta{ font-size:12.5px; color:var(--muted); }
  .close{ margin-left:auto; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; }
  .actions{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .btn{ border:1px solid transparent; border-radius:10px; padding:9px 16px; font-size:14px;
        font-weight:650; cursor:pointer; color:var(--ink); background:var(--surface); font-family:inherit; }
  .btn-primary{ background:var(--you); }
  .btn-wish{ background:transparent; border-color:var(--wish); color:#ffce7a; }
  .btn-ghost{ background:transparent; border-color:var(--hairline-strong); color:var(--ink-2); }
</style>
</head>
<body>
  <div class="pop">
    <div class="head">
      <span class="flag">🇬🇷</span>
      <div>
        <div class="name">Rethymno</div>
        <div class="meta">Crete, Greece</div>
      </div>
      <button class="close">×</button>
    </div>
    <div class="actions">
      <button class="btn btn-primary">✓&nbsp; Been there</button>
      <button class="btn btn-wish">☆&nbsp; Dream trip</button>
      <button class="btn btn-ghost">Plan a trip here →</button>
    </div>
  </div>
</body>
</html>
