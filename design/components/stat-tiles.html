<!-- @dsCard group="Components" name="Stat tiles & meters" subtitle="KPI row, hero value, same-ramp meter track" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ORBIT — Stat tiles & meters</title>
<style>
  :root{ --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
         --hairline:rgba(255,255,255,.10); --you:#3987e5; --you-deep:#184f95; --wish:#c98500;
         --radius:14px; --font:system-ui,-apple-system,"Segoe UI",sans-serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page); color:var(--ink); font-family:var(--font); padding:32px; }
  .rail{ display:flex; gap:12px; flex-wrap:wrap; }
  .tile{ background:rgba(26,26,25,.88); border:1px solid var(--hairline); border-radius:var(--radius);
         padding:14px 16px 12px; width:200px; }
  .label{ display:block; font-size:12px; font-weight:600; color:var(--muted); }
  .value{ display:block; font-size:30px; font-weight:650; line-height:1.15; margin-top:2px; }
  .of{ font-size:15px; color:var(--muted); font-weight:600; }
  .sub{ display:block; font-size:11.5px; color:var(--muted); margin-top:4px; }
  .meter{ height:6px; border-radius:3px; background:var(--you-deep); margin-top:10px; overflow:hidden; }
  .meter-fill{ height:100%; border-radius:3px; background:var(--you); }
  .meter.amber{ background:rgba(201,133,0,.22); }
  .meter.amber .meter-fill{ background:var(--wish); }
</style>
</head>
<body>
  <div class="rail">
    <div class="tile">
      <span class="label">Countries visited</span>
      <span class="value">42</span>
      <div class="meter"><div class="meter-fill" style="width:24%"></div></div>
      <span class="sub">of 177 countries</span>
    </div>
    <div class="tile">
      <span class="label">World explored</span>
      <span class="value">23.7%</span>
    </div>
    <div class="tile">
      <span class="label">Continents</span>
      <span class="value">5<span class="of"> / 7</span></span>
    </div>
    <div class="tile">
      <span class="label">Trip progress</span>
      <span class="value">7<span class="of"> / 11</span></span>
      <div class="meter amber"><div class="meter-fill" style="width:64%"></div></div>
      <span class="sub">done on this trip</span>
    </div>
  </div>
</body>
</html>
