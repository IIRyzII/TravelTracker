<!-- @dsCard group="Components" name="Chips & tags" subtitle="Plan chips, vote, badges, closed-during-stay" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ORBIT — Chips & tags</title>
<style>
  :root{ --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
         --hairline:rgba(255,255,255,.10); --hairline-strong:rgba(255,255,255,.16);
         --you:#3987e5; --wish:#c98500; --both:#9085e9; --font:system-ui,-apple-system,"Segoe UI",sans-serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page); color:var(--ink); font-family:var(--font); padding:32px; }
  h2{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; }
  .set{ margin-bottom:24px; }
  .row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chip{ background:var(--surface); border:1px solid var(--hairline-strong); color:var(--ink-2);
         border-radius:99px; padding:7px 14px; font-size:13.5px; font-weight:600; }
  .chip-wish{ border-color:rgba(201,133,0,.5); }
  .vote{ background:transparent; border:1px solid var(--hairline-strong); color:var(--ink-2);
         border-radius:99px; padding:5px 12px; font-size:12.5px; font-weight:700; }
  .vote.voted{ border-color:#d55181; color:#ff9fc2; background:rgba(213,81,129,.14); }
  .badge{ font-size:11.5px; font-weight:700; letter-spacing:.06em; border:1px solid var(--hairline-strong);
          color:var(--ink-2); border-radius:99px; padding:3px 10px; }
  .badge.live{ border-color:rgba(57,135,229,.6); color:#9cc4f2; }
  .closed{ font-size:11.5px; font-weight:700; color:#ffce7a; border:1px solid rgba(201,133,0,.55);
           border-radius:99px; padding:2px 9px; }
  .closed.all{ color:#ff9c9c; border-color:rgba(208,59,59,.65); }
</style>
</head>
<body>
  <div class="set"><h2>Planner chips</h2>
    <div class="row">
      <span class="chip chip-wish">☆ Crete, Greece</span>
      <span class="chip">Tokyo</span>
      <span class="chip">Lisbon</span>
    </div>
  </div>
  <div class="set"><h2>Vote</h2>
    <div class="row">
      <span class="vote voted">♥ 2</span>
      <span class="vote">♥ 0</span>
    </div>
  </div>
  <div class="set"><h2>Badges</h2>
    <div class="row">
      <span class="badge live">Live · Google Maps</span>
      <span class="badge">Curated</span>
    </div>
  </div>
  <div class="set"><h2>Open / closed while you're there</h2>
    <div class="row">
      <span class="closed">Closed Sun · Mon</span>
      <span class="closed all">Closed during your stay</span>
    </div>
  </div>
</body>
</html>
